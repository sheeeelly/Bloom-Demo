                  fabric: "全部",
                  silhouette: "全部",
                  neckline: "全部",
                  sleeve: "全部",
                  length: "全部",
                  color: "全部",
                  pattern: "全部",
                  listed: "全部",
                };
                state.activeSite = "全部";
                state.selectedSites = null;
                state.selectedPlatforms = null;
                render();
              };
            const checkAll = app.querySelector("#check-all");
            if (checkAll)
              checkAll.addEventListener("change", () => {
                const rows = filteredMonitor();
                if (checkAll.checked) state.selectedMonitorIds = rows.map((r) => r.id);
                else state.selectedMonitorIds = [];
                render();
              });
            app.querySelectorAll("[data-check]").forEach((el) =>
              el.addEventListener("change", () => {
                const id = el.getAttribute("data-check");
                if (el.checked) {
                  if (!state.selectedMonitorIds.includes(id)) state.selectedMonitorIds.push(id);
                } else {
                  state.selectedMonitorIds = state.selectedMonitorIds.filter((x) => x !== id);
                }
                render();
              })
            );
            const addBtn = app.querySelector("#btn-add-pool");
            if (addBtn) addBtn.onclick = () => addSelectedToPool();
            app.querySelectorAll("[data-ad-detail]").forEach((b) =>
              b.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                state.adDetailId = b.getAttribute("data-ad-detail");
                render();
              })
            );
            const closeDetail = app.querySelector("#ad-detail-close");
            const mask = app.querySelector("#ad-detail-mask");
            if (closeDetail) closeDetail.onclick = () => { state.adDetailId = null; render(); };
            if (mask) mask.addEventListener("click", (e) => {
              if (e.target === mask) { state.adDetailId = null; render(); }
            });
            app.querySelectorAll("[data-check-add]").forEach((b) =>
              b.addEventListener("click", () => {
                const id = b.getAttribute("data-check-add");
                if (!state.selectedMonitorIds.includes(id)) state.selectedMonitorIds.push(id);
                state.adDetailId = null;
                addSelectedToPool();
              })
            );

            // 流行趋势
            app.querySelectorAll("[data-trend-source]").forEach((b) =>
              b.addEventListener("click", () => {
                const id = b.getAttribute("data-trend-source");
                state.trendSourceModal = state.trendSourceModal === id ? null : id;
                render();
              })
            );
            const trendClose = app.querySelector("#trend-source-close");
            const trendMask = app.querySelector("#trend-source-mask");
            if (trendClose)
              trendClose.onclick = () => {
                state.trendSourceModal = null;
                render();
              };
            if (trendMask)
              trendMask.addEventListener("click", (e) => {
                if (e.target === trendMask) {
                  state.trendSourceModal = null;
                  render();
                }
              });
            app.querySelectorAll("[data-trend-toggle]").forEach((b) =>
              b.addEventListener("click", () => {
                const key = b.getAttribute("data-trend-toggle");
                if (!state.trendOpen) state.trendOpen = { elements: true, fabrics: true, colors: true };
                state.trendOpen[key] = !state.trendOpen[key];
                render();
              })
            );
            app.querySelectorAll("[data-trend-item]").forEach((b) =>
              b.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                state.trendItemModal = b.getAttribute("data-trend-item");
                state.trendSourceModal = null;
                render();
              })
            );
            const itemClose = app.querySelector("#trend-item-close");
            const itemMask = app.querySelector("#trend-item-mask");
            if (itemClose)
              itemClose.onclick = () => {
                state.trendItemModal = null;
                render();
              };
            if (itemMask)
              itemMask.addEventListener("click", (e) => {
                if (e.target === itemMask) {
                  state.trendItemModal = null;
                  render();
                }
              });
            app.querySelectorAll(".donut-chart-wrap").forEach((wrap) => {
              const tip = wrap.querySelector(".donut-tip");
              wrap.querySelectorAll(".donut-seg").forEach((seg) => {
                seg.addEventListener("mousemove", (e) => {
                  if (!tip) return;
                  tip.hidden = false;
                  tip.textContent = seg.getAttribute("data-tip") || "";
                  const rect = wrap.getBoundingClientRect();
                  tip.style.left = e.clientX - rect.left + 12 + "px";
                  tip.style.top = e.clientY - rect.top + 12 + "px";
                });
                seg.addEventListener("mouseleave", () => {
                  if (tip) tip.hidden = true;
                });
              });
            });

            // 站内爆款
            const oppFilter = app.querySelector("#internal-opp-filter");
            if (oppFilter)
              oppFilter.addEventListener("change", () => {
                state.internalOppFilter = oppFilter.value;
                render();
              });
            const resetInternal = app.querySelector("#btn-reset-internal");
            if (resetInternal)
              resetInternal.onclick = () => {
                state.filters.week = "2026-W30";
                state.filters.category = "全部";
                state.internalOppFilter = "all";
                resetDesignFilters();
                render();
              };
            const checkAllInternal = app.querySelector("#check-all-internal");
            if (checkAllInternal)
              checkAllInternal.addEventListener("change", () => {
                const rows = filteredInternal();
                state.selectedInternalIds = checkAllInternal.checked ? rows.map((r) => r.id) : [];
                render();
              });
            app.querySelectorAll("[data-icheck]").forEach((el) =>
              el.addEventListener("change", () => {
                const id = el.getAttribute("data-icheck");
                if (el.checked) {
                  if (!state.selectedInternalIds.includes(id)) state.selectedInternalIds.push(id);
                } else {
                  state.selectedInternalIds = state.selectedInternalIds.filter((x) => x !== id);
                }
                render();
              })
            );
            app.querySelectorAll("[data-internal-detail]").forEach((b) =>
              b.addEventListener("click", () => {
                state.internalDetailId = b.getAttribute("data-internal-detail");
                state.internalChartMetric = "sales";
                render();
              })
            );
            const backInternal = app.querySelector("#btn-internal-back");
            if (backInternal)
              backInternal.onclick = () => {
                state.internalDetailId = null;
                render();
              };
            app.querySelectorAll("[data-chart-metric]").forEach((b) =>
              b.addEventListener("click", () => {
                state.internalChartMetric = b.getAttribute("data-chart-metric");
                render();
              })
            );
            const addInternalBtn = app.querySelector("#btn-add-internal-pool");
            if (addInternalBtn) addInternalBtn.onclick = () => addInternalToPool();
            app.querySelectorAll("[data-internal-add]").forEach((b) =>
              b.addEventListener("click", () => {
                addInternalToPool([b.getAttribute("data-internal-add")], b.getAttribute("data-opp"));
              })
            );
          }

          if (state.route === "pool") {
            app.querySelectorAll("[data-filter]").forEach((b) =>
              b.addEventListener("click", () => {
                state.scenarioFilter = b.getAttribute("data-filter");
                render();
              })
            );
            app.querySelectorAll("[data-opp-select]").forEach((card) =>
              card.addEventListener("click", (e) => {
                if (e.target.closest("[data-opp-ai], [data-opp-scheme]")) return;
                state.selectedOppId = card.getAttribute("data-opp-select");
                state.scheme = null;
                state.aiAnalyzed = false;
                state.rejectReason = "";
                render();
              })
            );
            app.querySelectorAll("[data-opp-ai]").forEach((b) =>
              b.addEventListener("click", (e) => {
                e.stopPropagation();
                state.selectedOppId = b.getAttribute("data-opp-ai");
                state.scheme = null;
                state.aiAnalyzed = true;
                state.rejectReason = "";
                setRoute("scheme");
                showToast("已打开方案 · 右侧 AI 分析 · " + oppCode(selectedOpp()));
              })
            );
            app.querySelectorAll("[data-pool-sort]").forEach((b) =>
              b.addEventListener("click", () => {
                state.poolSort = b.getAttribute("data-pool-sort");
                render();
              })
            );
            const emailOnly = app.querySelector("#pool-email-only");
            if (emailOnly)
              emailOnly.addEventListener("change", () => {
                state.poolEmailOnly = emailOnly.checked;
                render();
              });
            app.querySelectorAll("[data-attr-filter]").forEach((row) =>
              row.addEventListener("click", () => {
                const v = row.getAttribute("data-attr-filter");
                state.attrFilter = state.attrFilter === v ? null : v;
                render();
              })
            );
            app.querySelectorAll("[data-opp-scheme]").forEach((b) =>
              b.addEventListener("click", (e) => {
                e.stopPropagation();
                state.selectedOppId = b.getAttribute("data-opp-scheme");
                state.scheme = null;
                state.aiAnalyzed = true;
                state.rejectReason = "";
                setRoute("scheme");
                showToast("已根据选品管理机会自动填齐方案字段");
              })
            );
          }

          if (state.route === "scheme") {
            bindSchemeFields();
            app.querySelectorAll("[data-ai-jump]").forEach((a) =>
              a.addEventListener("click", (e) => {
                e.preventDefault();
                const tab = a.getAttribute("data-ai-jump");
                if (tab) state.mcTab = tab;
                state.monitorExpanded = true;
                setRoute("monitor");
                showToast("已跳转监控报告 · " + (channelMeta(tab).label || tab));
              })
            );
          }

          if (state.route === "approval") {
            app.querySelectorAll("[data-go]").forEach((b) =>
              b.addEventListener("click", () => setRoute(b.getAttribute("data-go")))
            );
            const viewScheme = app.querySelector("#btn-view-scheme");
            if (viewScheme)
              viewScheme.onclick = () => {
                state.schemeReviewOpen = true;
                state.aiAnalyzed = true;
                render();
              };
            if (state.schemeReviewOpen) {
              bindSchemeFields();
              app.querySelectorAll("#scheme-review-mask [data-ai-jump]").forEach((a) =>
                a.addEventListener("click", (e) => {
                  e.preventDefault();
                  const tab = a.getAttribute("data-ai-jump");
                  if (tab) state.mcTab = tab;
                  state.schemeReviewOpen = false;
                  state.monitorExpanded = true;
                  setRoute("monitor");
                })
              );
            }
            const submitLead = app.querySelector("#btn-submit-lead");
            if (submitLead)
              submitLead.onclick = () => {
                state.role = "lead";
                syncRoleUI();
                showToast("已切换至品类负责人视角");
                render();
              };
            const approve = app.querySelector("#btn-approve");
            if (approve)
              approve.onclick = () => {
                state.approvalResult = "approved";
                state.rejectReason = "";
                showToast("审批通过，已写入选款");
                render();
              };
            const reject = app.querySelector("#btn-reject");
            if (reject)
              reject.onclick = () => {
                const reason = (app.querySelector("#reject-reason") || {}).value || "";
                if (!reason.trim()) {
                  showToast("驳回须填写原因");
                  return;
                }
                state.rejectReason = reason.trim();
                setRoute("scheme");
                showToast("已驳回，原因已回流至方案");
              };
          }

          // 居中弹窗：帮助 / 参数 / 方案批注
          app.querySelectorAll("[data-modal-close]").forEach((b) =>
            b.addEventListener("click", () => {
              const id = b.getAttribute("data-modal-close");
              if (id === "ai-help") state.aiHelpOpen = false;
              if (id === "ai-params") state.aiParamsOpen = false;
              if (id === "scheme-review") state.schemeReviewOpen = false;
              render();
            })
          );
          app.querySelectorAll("[data-modal-mask]").forEach((mask) =>
            mask.addEventListener("click", (e) => {
              if (e.target !== mask) return;
              const id = mask.getAttribute("data-modal-mask");
              if (id === "ai-help") state.aiHelpOpen = false;
              if (id === "ai-params") state.aiParamsOpen = false;
              if (id === "scheme-review") state.schemeReviewOpen = false;
              render();
            })
          );
          const syncParam = (key, raw) => {
            let v = Number(raw);
            if (!Number.isFinite(v)) return;
            v = Math.round(v);
            state.aiParams[key] = v;
            app.querySelectorAll(`[data-param-val="${key}"]`).forEach((el) => {
              el.textContent = String(v);
            });
            app.querySelectorAll(`[data-param-range="${key}"]`).forEach((el) => {
              el.value = String(v);
            });
            app.querySelectorAll(`[data-param-num="${key}"]`).forEach((el) => {
              el.value = String(v);
            });
          };
          app.querySelectorAll("[data-param-range]").forEach((el) =>
            el.addEventListener("input", () => syncParam(el.getAttribute("data-param-range"), el.value))
          );
          app.querySelectorAll("[data-param-num]").forEach((el) =>
            el.addEventListener("change", () => syncParam(el.getAttribute("data-param-num"), el.value))
          );
          const resetParams = app.querySelector("#btn-ai-params-reset");
          if (resetParams)
            resetParams.onclick = () => {
              state.aiParams = {
                trendWeight: 25,
                competitorWeight: 25,
                adWeight: 20,
                internalWeight: 15,
                socialWeight: 15,
                goScore: 75,
                cautionScore: 50,
              };
              render();
            };
          const saveAnno = app.querySelector("#btn-save-annotation");
          if (saveAnno)
            saveAnno.onclick = () => {
              const ta = app.querySelector("#scheme-annotation-input");
              state.schemeAnnotations = (ta && ta.value) || "";
              state.schemeReviewOpen = false;
              showToast("批注已保存");
              render();
            };

          // scheme page AI help/params (right rail)
          const helpBtn2 = app.querySelector("#hdr-ai-help");
          if (helpBtn2) helpBtn2.onclick = () => { state.aiHelpOpen = true; render(); };
          const paramsBtn2 = app.querySelector("#hdr-ai-params");
          if (paramsBtn2) paramsBtn2.onclick = () => { state.aiParamsOpen = true; render(); };

          const addSocial = app.querySelector("#btn-add-social");
          if (addSocial) addSocial.onclick = () => showToast("Demo：打开社媒证据录入表单");
          const addMap = app.querySelector("#btn-add-mapping");
          if (addMap) addMap.onclick = () => showToast("Demo：新增映射（选内部属性 → 填外部叫法 → 生效）");
          app.querySelectorAll("[data-confirm-map]").forEach((b) =>
            b.addEventListener("click", () => {
              const i = Number(b.getAttribute("data-confirm-map"));
              if (ATTR_MAP_ROWS[i]) ATTR_MAP_ROWS[i].status = "已生效";
              showToast("已确认映射，下批爬取生效");
              render();
            })
          );
          app.querySelectorAll("[data-receipt-toggle]").forEach((b) =>
            b.addEventListener("click", () => {
              const id = b.getAttribute("data-receipt-toggle");
              state.receiptDetailId = state.receiptDetailId === id ? null : id;
              render();
            })
          );
          app.querySelectorAll("[data-retry-sync]").forEach((b) =>
            b.addEventListener("click", () => {
              const id = b.getAttribute("data-retry-sync");
              const row = SYNC_RECEIPTS.find((r) => r.schemeId === id);
              if (row) {
                row.syncStatus = "Sync_Pending";
                row.retries += 1;
                row.updated = "刚刚";
                const syncStep = (row.progress || []).find((p) => p.key === "sync");
                if (syncStep) { syncStep.state = "active"; syncStep.detail = "同步中 · 已重试 " + row.retries + " 次"; syncStep.at = "刚刚"; }
              }
              showToast("已触发手动重试 · " + id);
              render();
            })
          );
          const saveSites = app.querySelector("#btn-save-sites-cfg");
          if (saveSites)
            saveSites.onclick = () => {
              app.querySelectorAll("[data-site-cfg-mk]").forEach((inp) => {
                const name = inp.getAttribute("data-site-cfg-mk");
                const mk = inp.value.split(/[,，\s]+/).map((x) => x.trim()).filter(Boolean);
                SITE_GROUPS.forEach((g) => {
                  const s = g.sites.find((x) => x.name === name);
                  if (s) s.markets = mk;
                });
              });
              app.querySelectorAll("[data-site-cfg-on]").forEach((inp) => {
                const name = inp.getAttribute("data-site-cfg-on");
                SITE_GROUPS.forEach((g) => {
                  const s = g.sites.find((x) => x.name === name);
                  if (s) s.enabled = inp.checked;
                });
              });
              showToast("站点与市场配置已保存（Demo）");
              render();
            };
          app.querySelectorAll("[data-go]").forEach((b) =>
            b.addEventListener("click", () => setRoute(b.getAttribute("data-go")))
          );
        }

        function roleLabel(role) {
          return role === "admin" ? "管理员" : role === "lead" ? "品类负责人" : "品类运营";
        }

        function syncRoleUI() {
          document.querySelectorAll("#account-popover [data-role]").forEach((b) => {
            b.classList.toggle("is-active", b.getAttribute("data-role") === state.role);
          });
          const av = document.getElementById("user-avatar");
          const nm = document.getElementById("user-name");
          const ctx = document.getElementById("user-context");
          if (av) av.textContent = state.role === "admin" ? "管" : state.role === "lead" ? "负" : "运";
          if (nm) nm.textContent = roleLabel(state.role);
          const mk = state.market === "all" ? "全部市场" : state.market;
          if (ctx) ctx.textContent = `${state.categoryLine} · ${mk}`;
          const catSel = document.getElementById("account-category");
          const mkSel = document.getElementById("account-market");
          if (catSel) {
            catSel.value = state.categoryLine;
            catSel.disabled = state.role !== "admin";
          }
          if (mkSel) mkSel.value = state.market;
          const pop = document.getElementById("account-popover");
          const tog = document.getElementById("account-toggle");
          if (pop) pop.hidden = !state.accountOpen;
          if (tog) tog.setAttribute("aria-expanded", state.accountOpen ? "true" : "false");
          const batch = document.getElementById("batch-label");
          if (batch) batch.textContent = `批次 2026-W30 · ${state.categoryLine} 轨 · ${mk}`;
        }

        function bindAccountMenu() {
          const tog = document.getElementById("account-toggle");
          if (tog) {
            tog.onclick = (e) => {
              e.stopPropagation();
              state.accountOpen = !state.accountOpen;
              syncRoleUI();
            };
          }
          document.querySelectorAll("#account-popover [data-role]").forEach((b) => {
            b.onclick = (e) => {
              e.stopPropagation();
              state.role = b.getAttribute("data-role");
              if (state.role !== "admin" && state.categoryLine !== "AT") {
                state.categoryLine = "AT";
                state.siteLine = "AT";
                showToast("非管理员已锁定品类为 AT");
              }
              syncRoleUI();
              render();
            };
          });
          const catSel = document.getElementById("account-category");
          if (catSel) {
            catSel.onchange = () => {
              if (state.role !== "admin") return;
              if (catSel.value !== "AT") {
                showToast("该品类接入中：平台架构支持多品类，数据源标定后即可开通");
                catSel.value = "AT";
                state.categoryLine = "AT";
              } else {
                state.categoryLine = catSel.value;
                state.siteLine = catSel.value;
              }
              syncRoleUI();
              render();
            };
          }
          const mkSel = document.getElementById("account-market");
          if (mkSel) {
            mkSel.onchange = () => {
              state.market = mkSel.value;
              showToast(state.market === "all" ? "已切换到全部市场" : "已切换到 " + state.market + " 市场口径");
              syncRoleUI();
              render();
            };
          }
        }

        document.addEventListener("click", (e) => {
          const menu = document.getElementById("account-menu");
          if (state.accountOpen && menu && !menu.contains(e.target)) {
            state.accountOpen = false;
            syncRoleUI();
          }
        });

        function boot() {
          let id = (location.hash || "#dashboard").replace("#", "");
          if (id === "overview" || id === "sources") id = "dashboard";
          if (id === "ai") id = "scheme";
          if (id === "sitesConfig") id = "dashboard";
          if (!ROUTES.some((r) => r.id === id)) id = "dashboard";
          state.route = id;
          render();
        }

        window.addEventListener("hashchange", boot);
        bindAccountMenu();
        syncRoleUI();
        boot();
      })();
    </script>
  </body>
</html>
