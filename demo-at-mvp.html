            lines.push(`面料沿用现款主料；工艺重点：加内衬防透、肩带防滑。样衣色建议 ${color || "现款色"}。`);
          } else if (opp.scenario === "fix_positive") {
            lines.push(`保留现款面料与版型主体；叠加领型/裙长调整。样衣色 ${color || "现款色"}；廓形参考 ${silhouette}。`);
          } else {
            lines.push(`建议主料：${fabricHint}。样衣色 ${color || "待定"}；廓形 ${silhouette}；裙长及地。`);
          }
          if (mon) lines.push(`参考竞品款式特征：${mon.title}（${mon.color} / ${mon.silhouette}）。`);
          lines.push("打版时核对领口深度、肩带宽度与内衬层数，避免透色与滑肩。");
          return lines.join(" ");
        }

        /** 从机会池选中项自动填齐选品方案（对齐下版单字段） */
        function buildSchemeFromOpportunity(opp) {
          const d = SCHEME_DEFAULTS[opp.scenario];
          const mon = monitorForOpp(opp);
          const internal = opp.internalId ? INTERNAL_HOTS.find((x) => x.id === opp.internalId) : null;
          const priceNum = parseFloat(String(opp.price).replace(/[^0-9.]/g, ""));
          const plannedPrice = Number.isFinite(priceNum)
            ? priceNum
            : mon
              ? mon.price
              : internal
                ? Math.round(internal.revenue / Math.max(internal.sales, 1))
                : "";
          const similarKey = opp.similar ? opp.similar.goodsId : null;
          const goods = similarKey && GOODS_MASTER[similarKey] ? GOODS_MASTER[similarKey] : null;
          const silhouette = mon
            ? mon.silhouette
            : internal
              ? internal.silhouette
              : opp.scenario === "fix_positive"
                ? "Mermaid"
                : "Column";
          const sampleColor = mon
            ? mon.color
            : internal
              ? internal.color
              : opp.title.includes("—")
                ? opp.title.split("—").pop().trim()
                : "";
          const categoryMap = { Atelier: "Formal Dresses", Bridesmaid: "Bridesmaid Dresses", Prom: "Prom Dresses" };
          const category = goods
            ? goods.category
            : mon
              ? categoryMap[mon.category] || "Formal Dresses"
              : internal
                ? categoryMap[internal.category] || "Formal Dresses"
                : "Formal Dresses";

          const refs = [];
          if (internal) {
            refs.push({ no: String(internal.goodsId), url: `https://www.azazie.com/products/${internal.goodsId}` });
          } else if (opp.url || opp.site !== "内部沉淀") {
            refs.push({
              no: mon ? `${mon.site}-${mon.id.toUpperCase()}` : opp.site,
              url: opp.url || "",
            });
          }
          if (goods) {
            refs.push({
              no: similarKey,
              url: `https://www.azazie.com/products/${goods.productId}`,
            });
          }
          if (refs.length === 0) refs.push({ no: opp.id, url: "" });

          const isNew = opp.scenario === "pure_new";
          const monOrInternal = mon || (internal
            ? { title: internal.name, color: internal.color, silhouette: internal.silhouette }
            : null);
          return {
            oppId: opp.id,
            autoFilled: true,
            productId: goods ? goods.productId : internal ? String(internal.goodsId) : isNew ? "" : "GOODS-1076962",
            ddid: goods ? goods.ddid : isNew ? "" : "DD-26070018",
            category,
            brand: goods ? goods.brand : "Azazie Atelier",
            productName: goods
              ? goods.productName
              : mon
                ? mon.title
                : internal
                  ? internal.name
                  : opp.title.replace(/^AZ\s+\S+\s*·\s*/, ""),
            styleSource: "US",
            developMonth: currentDevelopMonth(),
            styleType: d.styleType,
            sampleColor: sampleColor || "Champagne",
            colorReplaceable: "否",
            skirtLength: SKIRT_BY_SILHOUETTE[silhouette] || "及地裙",
            fabric: goods
              ? goods.fabric
              : internal
                ? internal.fabric
                : FABRIC_BY_SILHOUETTE[silhouette] || "FAB-107696 · 醋酸缎面 75D",
            plannedPrice: plannedPrice === "" ? "" : plannedPrice,
            multiplier: 4.3,
            refs: refs.slice(0, 3),
            evidence: buildEvidence(opp, mon, d),
            scene: mon && mon.category === "Bridesmaid" ? "婚礼伴娘、宴会" : "晚宴、婚礼、正式场合",
            craft:
              opp.scenario === "fix_negative"
                ? opp.fix && opp.fix.length
                  ? opp.fix.join("；")
                  : "加内衬防透；肩带防滑结构"
                : opp.scenario === "fix_positive"
                  ? opp.keep && opp.keep.length
                    ? "保留：" + opp.keep.join("；")
                    : "领型结构微调；裙长一档调整"
                  : mon
                    ? `参考竞品廓形 ${mon.silhouette}`
                    : "按参考款结构打版",
            sizeType: "全码",
            hasFabric: d.hasFabric,
            reusePattern: d.reusePattern,
            proposer: state.role === "lead" ? "品类负责人" : "品类运营",
            newSource: d.source,
            orderRemark: buildOrderRemark(opp, monOrInternal),
            imagePrefill: Boolean(opp.url || mon || internal),
            imageHue: mon
              ? mon.imgHue || "220"
              : internal
                ? String((internal.goodsId || "220").toString().slice(-3) % 360)
                : "220",
            imageLabel: mon
              ? `${mon.site} · ${mon.title}`
              : internal
                ? `${internal.name} · ${internal.color}`
                : opp.title,
          };
        }

        function ensureScheme() {
          const opp = selectedOpp();
          if (!state.scheme || state.scheme.oppId !== opp.id) {
            state.scheme = buildSchemeFromOpportunity(opp);
          }
          return state.scheme;
        }

        function maxCost(price, mult) {
          const n = Number(price);
          const m = Number(mult) || 4.3;
          if (!(n > 0)) return "";
          return ((n / m) * 7).toFixed(2);
        }

        function escapeHtml(str) {
          return String(str == null ? "" : str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function escapeAttr(str) {
          return escapeHtml(str).replace(/"/g, "&quot;");
        }

        function fmtK(n) {
          if (n == null || n === 0) return "—";
          if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
          return String(n);
        }

        function showToast(msg) {
          toastEl.hidden = false;
          toastEl.textContent = msg;
          clearTimeout(showToast._t);
          showToast._t = setTimeout(() => {
            toastEl.hidden = true;
          }, 2200);
        }

        function setRoute(id, opts) {
          if (id === "ai") id = "scheme";
          if (id === "sitesConfig") id = "dashboard";
          if (!ROUTES.some((r) => r.id === id)) return;
          state.route = id;
          if (id === "monitor") state.monitorExpanded = true;
          if (opts && opts.oppId) {
            state.selectedOppId = opts.oppId;
            state.scheme = null;
          }
          if (id === "scheme") ensureScheme();
          if (id !== "approval") state.approvalResult = null;
          location.hash = id;
          render();
        }

        function filteredMonitor() {
          const f = state.filters;
          const atSites = new Set(sitesInLine(state.categoryLine || "AT"));
          return MONITOR_ROWS.filter((r) => {
            if (state.categoryLine === "AT" && r.line && r.line !== "AT" && !atSites.has(r.site)) {
              // keep AT-line rows; drop explicit non-AT lines when viewing AT
              if (r.line !== "AT") return false;
            }
            if (state.selectedSites != null && state.selectedSites.length && !state.selectedSites.includes(r.site)) return false;
            else if (state.selectedSites == null && state.activeSite && state.activeSite !== "全部" && r.site !== state.activeSite) return false;
            if (state.mcTab === "ads" && state.selectedPlatforms != null && state.selectedPlatforms.length) {
              const plat = normalizePlatform(r.platform);
              if (!state.selectedPlatforms.includes(plat)) return false;
            }
            if (f.category !== "全部" && r.category !== f.category) return false;
            if (f.status !== "全部" && r.status !== f.status) return false;
            if (f.shipsNow === "是" && !r.shipsNow) return false;
            if (f.shipsNow === "否" && r.shipsNow) return false;
            if (f.hasAd === "有投放" && !(r.adPlays > 0)) return false;
            if (f.hasAd === "无投放" && r.adPlays > 0) return false;
            if (f.similar === "有相似" && !r.similar) return false;
            if (f.similar === "无相似" && r.similar) return false;
            if (!matchesDesignFilters(r, f)) return false;
            if (f.listed === "本周上新" && r.status !== "上新") return false;
            if (f.listed === "近7天" && !(r.status === "上新" || r.status === "上升")) return false;
            if (f.listed === "近15天" && r.status === "下架") return false;
            if (f.listed === "近30天" && r.status === "下架") return false;
            if (state.mcTab === "ads" && !(r.adPlays > 0)) return false;
            if (state.market !== "all") {
              const site = (SITE_GROUPS.find((g) => g.line === state.categoryLine) || SITE_GROUPS[0]).sites.find((s) => s.name === r.site);
              if (site && site.markets && !site.markets.includes(state.market)) return false;
            }
            return true;
          });
        }

        const AD_PLATFORMS = [
          { value: "Facebook", label: "Facebook" },
          { value: "Instagram", label: "Instagram" },
          { value: "TikTok", label: "Tik Tok" },
        ];

        function normalizePlatform(p) {
          const s = String(p || "").replace(/\s+/g, "");
          if (/tiktok/i.test(s)) return "TikTok";
          if (/instagram/i.test(s)) return "Instagram";
          if (/facebook|meta/i.test(s)) return "Facebook";
          return p || "";
        }

        function designFilterOpts() {
          const mon = MONITOR_ROWS;
          const ih = INTERNAL_HOTS;
          const uniq = (arr) => ["全部", ...new Set(arr.filter(Boolean))];
          return {
            fabrics: uniq([...mon.map((r) => r.fabric), ...ih.map((r) => r.fabric)]),
            silhouettes: uniq([...mon.map((r) => r.silhouette), ...ih.map((r) => r.silhouette)]),
            necklines: uniq(mon.map((r) => r.neckline)),
            lengths: uniq(mon.map((r) => r.length)),
            colors: uniq([...mon.map((r) => r.color), ...ih.map((r) => r.color)]),
            patterns: ["全部", "纯色", "印花", "亮片"],
            sleeves: ["全部", "无袖", "短袖", "长袖"],
          };
        }

        function matchesDesignFilters(r, f) {
          if (f.fabric && f.fabric !== "全部" && r.fabric != null && r.fabric !== f.fabric) return false;
          if (f.silhouette && f.silhouette !== "全部" && r.silhouette != null && r.silhouette !== f.silhouette) return false;
          if (f.neckline && f.neckline !== "全部" && r.neckline != null && r.neckline !== f.neckline) return false;
          if (f.length && f.length !== "全部" && r.length != null && r.length !== f.length) return false;
          if (f.color && f.color !== "全部" && r.color != null && r.color !== f.color) return false;
          if (f.sleeve && f.sleeve !== "全部" && r.sleeve != null && r.sleeve !== f.sleeve) return false;
          if (f.pattern && f.pattern !== "全部") {
            const tags = String(r.detailTags || r.fabric || "").toLowerCase();
            if (f.pattern === "亮片" && !(tags.includes("sequin") || tags.includes("bead") || /亮片/.test(tags))) return false;
            if (f.pattern === "印花" && !(tags.includes("print") || /印花/.test(tags))) return false;
            if (f.pattern === "纯色" && (tags.includes("sequin") || tags.includes("print") || tags.includes("bead"))) return false;
          }
          return true;
        }

        function renderDesignDetailRow(f) {
          const o = designFilterOpts();
          return `
            <div class="zf-row">
              <div class="zf-label">设计细节</div>
              <div class="zf-body">
                <label class="zf-select"><span>面料</span><select data-ff="fabric">${o.fabrics.map((s) => `<option ${f.fabric === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
                <label class="zf-select"><span>廓形</span><select data-ff="silhouette">${o.silhouettes.map((s) => `<option ${f.silhouette === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
                <label class="zf-select"><span>领型</span><select data-ff="neckline">${o.necklines.map((s) => `<option ${f.neckline === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
                <label class="zf-select"><span>裙长</span><select data-ff="length">${o.lengths.map((s) => `<option ${f.length === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
                <label class="zf-select"><span>颜色</span><select data-ff="color">${o.colors.map((s) => `<option ${f.color === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
                <label class="zf-select"><span>图案</span><select data-ff="pattern">${o.patterns.map((s) => `<option ${f.pattern === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
                <label class="zf-select"><span>袖长</span><select data-ff="sleeve">${o.sleeves.map((s) => `<option ${(f.sleeve || "全部") === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
              </div>
            </div>`;
        }

        function designSelectedChips(f) {
          const chips = [];
          if (f.fabric !== "全部") chips.push(["fabric", "面料", f.fabric]);
          if (f.silhouette !== "全部") chips.push(["silhouette", "廓形", f.silhouette]);
          if (f.neckline !== "全部") chips.push(["neckline", "领型", f.neckline]);
          if (f.length !== "全部") chips.push(["length", "裙长", f.length]);
          if (f.color !== "全部") chips.push(["color", "颜色", f.color]);
          if (f.pattern !== "全部") chips.push(["pattern", "图案", f.pattern]);
          if (f.sleeve && f.sleeve !== "全部") chips.push(["sleeve", "袖长", f.sleeve]);
          return chips;
        }

        function renderSelectedChipsRow(chips) {
          if (!chips.length) return "";
          return `<div class="zf-row zf-row--chips"><div class="zf-label">已选</div><div class="zf-body filter-selected-row">${chips
            .map(([k, lab, v]) => `<button type="button" class="chip chip--removable" data-clear-filter="${k}">${lab}: ${escapeHtml(v)} ×</button>`)
            .join("")}</div></div>`;
        }

        function resetDesignFilters() {
          state.filters.fabric = "全部";
          state.filters.silhouette = "全部";
          state.filters.neckline = "全部";
          state.filters.sleeve = "全部";
          state.filters.length = "全部";
          state.filters.color = "全部";
          state.filters.pattern = "全部";
        }

        function monitorStats(rows) {
          const newCnt = rows.filter((r) => r.status === "上新").length;
          const upCnt = rows.filter((r) => r.status === "上升").length;
          const offCnt = rows.filter((r) => r.status === "下架").length;
          const adCnt = rows.filter((r) => r.adPlays > 0).length;
          const shipsCnt = rows.filter((r) => r.shipsNow).length;
          const simCnt = rows.filter((r) => r.similar).length;
          const avgPlays =
            adCnt === 0
              ? 0
              : Math.round(rows.filter((r) => r.adPlays > 0).reduce((s, r) => s + r.adPlays, 0) / adCnt);
          return { newCnt, upCnt, offCnt, adCnt, shipsCnt, simCnt, avgPlays, total: rows.length };
        }

        function siteCount(name) {
          if (name === "全部") return MONITOR_ROWS.length;
          return MONITOR_ROWS.filter((r) => r.site === name).length;
        }

        function renderSiteSidebar() {
          const q = (state.siteQuery || "").trim().toLowerCase();
          let html = `
            <aside class="site-panel">
              <div class="site-panel__head">我的监控</div>
              <div class="site-panel__search"><input id="site-search" placeholder="搜索站点" value="${escapeAttr(state.siteQuery)}"></div>
              <div class="site-panel__list">
                <button type="button" class="site-item ${state.activeSite === "全部" ? "is-active" : ""}" data-site="全部">
                  <span>全部动态</span><span class="site-item__count">${siteCount("全部")}</span>
                </button>`;
          SITE_GROUPS.forEach((g) => {
            const sites = g.sites.filter((s) => !q || s.name.toLowerCase().includes(q));
            if (!sites.length) return;
            html += `<div class="site-group">${g.line}</div>`;
            sites.forEach((s) => {
              html += `
                <button type="button" class="site-item ${state.activeSite === s.name ? "is-active" : ""}" data-site="${escapeAttr(s.name)}" title="${escapeAttr(s.url)}">
                  <span>${s.name}</span><span class="site-item__count">${siteCount(s.name)}</span>
                </button>`;
            });
          });
          html += `</div></aside>`;
          return html;
        }

        function rowChecked(id) {
          return state.selectedMonitorIds.includes(id);
        }

        function tableCheckboxHeader(rows) {
          const allOn = rows.length && rows.every((r) => rowChecked(r.id));
          return `<th class="col-check"><input type="checkbox" id="check-all" ${allOn ? "checked" : ""} aria-label="全选"></th>`;
        }

        function tableCheckboxCell(r) {
          return `<td class="col-check"><input type="checkbox" data-check="${r.id}" ${rowChecked(r.id) ? "checked" : ""} aria-label="选择 ${escapeAttr(r.title)}"></td>`;
        }

        function addSelectedToPool() {
          const ids = state.selectedMonitorIds.slice();
          if (!ids.length) {
            showToast("请先勾选监控商品");
            return;
          }
          let firstId = null;
          ids.forEach((mid) => {
            let opp = opportunityList.find((o) => o.monitorId === mid);
            if (!opp) {
              const r = MONITOR_ROWS.find((x) => x.id === mid);
              if (!r) return;
              opp = {
                id: "opp-" + mid,
                code: nextOppCode(),
                monitorId: mid,
                scenario: r.scenario,
                title: r.title + " — " + r.color,
                site: r.site,
                price: "$" + r.price,
                listRank: r.rank,
                rankSemantics: r.line === "AT" || r.line === "BD" ? "sales_proxy" : "sales_proxy",
                shipsNow: r.shipsNow,
                adPlays: r.adPlays ? fmtK(r.adPlays) : null,
                adClicks: r.adClicks ? fmtK(r.adClicks) : null,
                adDays: r.adDays || null,
                colors: 3,
                similar: r.similar ? { goodsId: r.similar, note: r.voc || "内部相似命中" } : null,
                visual: r.scenario === "pure_new" ? "SKC · NEW" : r.scenario === "fix_negative" ? "FIX · VOC" : "ITER · +",
                url: (SITE_GROUPS.flatMap((g) => g.sites).find((s) => s.name === r.site) || {}).url || "",
              };
              opportunityList.push(opp);
            }
            if (!firstId) firstId = opp.id;
          });
          state.selectedOppId = firstId;
          state.scheme = null;
          state.selectedMonitorIds = [];
          showToast("已加入机会池：" + ids.length + " 条");
          setRoute("pool");
        }

        function channelMeta(id) {
          return MONITOR_CHANNELS.find((c) => c.id === id) || MONITOR_CHANNELS[0];
        }

        function syncShellChrome() {
          const shell = document.querySelector(".app-shell");
          if (shell) shell.classList.toggle("is-sidebar-collapsed", state.sidebarCollapsed);
          const btn = document.getElementById("sidebar-toggle");
          if (btn) {
            btn.textContent = state.sidebarCollapsed ? "›" : "‹";
            btn.title = state.sidebarCollapsed ? "展开导航" : "折叠导航";
            btn.setAttribute("aria-label", btn.title);
          }
        }

        function renderNav() {
          const nav = document.getElementById("sidenav");
          const monitorOpen = state.route === "monitor" && state.monitorExpanded;
          let html = "";
          ROUTES.filter((r) => r.nav !== "footer").forEach((r) => {
            if (r.id === "monitor") {
              html += `
                <div class="sidenav-group ${monitorOpen ? "is-open" : ""} ${state.route === "monitor" ? "is-current" : ""}">
                  <button type="button" class="sidenav-link ${state.route === "monitor" ? "is-active" : ""}" data-route="monitor">
                    <span class="sidenav-icon" aria-hidden="true">${r.icon}</span>
                    <span class="sidenav-label">${r.label}</span>
                    <span class="sidenav-caret" aria-hidden="true">${monitorOpen ? "▾" : "▸"}</span>
                  </button>
                  <div class="sidenav-sub">
                    ${MONITOR_CHANNELS.map(
                      (c) => `
                      <button type="button" class="sidenav-sublink ${state.route === "monitor" && state.mcTab === c.id ? "is-active" : ""}" data-mctab="${c.id}">
                        ${c.label}
                      </button>`
                    ).join("")}
                  </div>
                </div>`;
            } else {
              html += `
                <button type="button" class="sidenav-link ${state.route === r.id ? "is-active" : ""}" data-route="${r.id}">
                  <span class="sidenav-icon" aria-hidden="true">${r.icon}</span>
                  <span class="sidenav-label">${r.label}</span>
                </button>`;
            }
          });
          nav.innerHTML = html;
          nav.querySelectorAll("[data-route]").forEach((b) =>
            b.addEventListener("click", () => {
              const id = b.getAttribute("data-route");
              if (id === "monitor") {
                if (state.route === "monitor") {
                  state.monitorExpanded = !state.monitorExpanded;
                  renderNav();
                  return;
                }
                state.monitorExpanded = true;
                setRoute("monitor");
                return;
              }
              setRoute(id);
            })
          );
          nav.querySelectorAll(".sidenav-sublink[data-mctab]").forEach((b) =>
            b.addEventListener("click", (e) => {
              e.stopPropagation();
              const next = b.getAttribute("data-mctab");
              state.mcTab = next;
              state.monitorExpanded = true;
              state.adDetailId = null;
              state.internalDetailId = null;
              if (next !== "sites") {
                state.activeSite = "全部";
                state.siteQuery = "";
              }
              if (state.route !== "monitor") setRoute("monitor");
              else render();
            })
          );
          renderFooterNav();
          syncShellChrome();
        }

        function renderFooterNav() {
          const footer = document.querySelector(".sidebar-footer");
          if (!footer) return;
          let slot = document.getElementById("footer-nav");
          if (!slot) {
            slot = document.createElement("div");
            slot.id = "footer-nav";
            slot.className = "footer-nav";
            const sync = footer.querySelector(".sync-status");
            if (sync) sync.after(slot);
            else footer.prepend(slot);
          }
          const mapping = ROUTES.find((r) => r.id === "mapping");
          if (!mapping) {
            slot.innerHTML = "";
            return;
          }
          slot.innerHTML = `
            <button type="button" class="sidenav-link sidenav-link--footer ${state.route === "mapping" ? "is-active" : ""}" data-footer-route="mapping">
              <span class="sidenav-icon" aria-hidden="true">${mapping.icon}</span>
              <span class="sidenav-label">${mapping.label}</span>
            </button>`;
          slot.querySelectorAll("[data-footer-route]").forEach((b) =>
            b.addEventListener("click", () => setRoute(b.getAttribute("data-footer-route")))
          );
        }


        function oppCode(opp) {
          return (opp && opp.code) || String(opp && opp.id || "").toUpperCase();
        }

        function sampleImageStyle(hue) {
          const h = hue == null || hue === "" ? "220" : String(hue);
          return `background:linear-gradient(165deg,hsl(${h} 32% 82%),hsl(${h} 38% 52%))`;
        }

        function sampleImageFromOpp(opp) {
          const mon = monitorForOpp(opp);
          const internal = opp.internalId ? INTERNAL_HOTS.find((x) => x.id === opp.internalId) : null;
          const linked = state.scheme && state.scheme.oppId === opp.id ? state.scheme : null;

            (linked && linked.imageHue) ||
            (mon && mon.imgHue) ||
            (internal ? String(Number(String(internal.goodsId).slice(-3)) % 360) : "220");
          const label =
            (linked && linked.imageLabel) ||
            (mon ? mon.site + " · " + mon.title : null) ||
            (internal ? internal.name + " · " + internal.color : null) ||
            opp.title;
          return { hue, label, style: sampleImageStyle(hue) };
        }

        function nextOppCode() {
          const n = opportunityList.length + 1;
          return `OPP-AT-2607-${String(n).padStart(3, "0")}`;
        }

        function renderCenterModal(opts) {
          const id = opts.id;
          const title = opts.title;
          const body = opts.body;
          const foot = opts.foot;
          const wideCls = opts.wide ? " center-modal--wide" : "";

        function clampFactorScore(n) {
          return Math.max(1, Math.min(5, Math.round(n)));
        }

        /** 相似款属性：群形 / 布料 / 领形 / 颜色 / 裙长；相同属性 ≥80% 视为相似款 */
        const SIMILAR_ATTR_KEYS = ["silhouette", "fabric", "neckline", "color", "length"];

        function formatAdMetric(n) {
          if (n == null || n === "") return "—";
          const num = typeof n === "number" ? n : parseFloat(String(n).replace(/[^0-9.]/g, ""));
          if (!Number.isFinite(num)) return String(n);
          if (num >= 1000) return `${(num / 1000).toFixed(num >= 10000 ? 0 : 1)}K`;
          return String(Math.round(num));
        }

        function parseMoney(v) {
          const n = parseFloat(String(v == null ? "" : v).replace(/[^0-9.]/g, ""));
          return Number.isFinite(n) ? n : null;
        }

        function attrNorm(v) {
          return String(v || "")
            .toLowerCase()
            .replace(/[^a-z0-9\u4e00-\u9fff]/g, "");
        }

        function similarMatchDetail(sample, candidate) {
          let compared = 0;
          let matched = 0;
          const hits = [];
          const misses = [];
          SIMILAR_ATTR_KEYS.forEach((k) => {
            const a = sample[k];
            const b = candidate[k];
            if (!a || !b) return;
            compared += 1;
            if (attrNorm(a) === attrNorm(b)) {
              matched += 1;
              hits.push(k);
            } else {
              misses.push(k);
            }
          });
          const ratio = compared ? matched / compared : 0;
          return { compared, matched, ratio, pct: Math.round(ratio * 100), hits, misses, isSimilar: compared > 0 && ratio >= 0.8 };
        }

        function findSimilarInternals(sampleAttrs) {
          if (!sampleAttrs) return [];
          return INTERNAL_HOTS.map((item) => {
            const detail = similarMatchDetail(sampleAttrs, {
              silhouette: item.silhouette,
              fabric: item.fabric,
              neckline: item.neckline || (item.skus && item.skus[0] && item.skus[0].neckline),
              color: item.color,
              length: item.length || (String(item.name || "").toLowerCase().includes("mini") ? "Mini" : "Floor"),
            });
            return { item, ...detail };
          })
            .filter((x) => x.compared >= 3)
            .sort((a, b) => b.ratio - a.ratio || b.item.sales - a.item.sales);
        }

        function matchTrendSignals(mon) {
          if (!mon) return { elements: [], fabric: null, color: null };
          const text = `${mon.neckline || ""} ${mon.silhouette || ""} ${mon.detailTags || ""} ${mon.title || ""}`.toLowerCase();
          const alias = {
            mermaid: ["mermaid", "鱼尾", "开叉"],
            column: ["column", "直筒"],
            "a-line": ["a-line", "aline"],
            halter: ["halter", "挂脖"],
            cape: ["cape", "披肩"],
            cowl: ["cowl"],
            offshoulder: ["off-shoulder", "offshoulder", "一字肩"],
            square: ["square"],
          };
          const bag = text + " " + Object.keys(alias)
            .filter((k) => text.includes(k) || text.replace(/-/g, "").includes(k.replace(/-/g, "")))
            .flatMap((k) => alias[k])
            .join(" ");
          const elements = TREND_ITEMS.filter((t) => {
            if (t.type !== "元素" && t.type !== "廓形") return false;
            const name = t.name.toLowerCase();
            const key = t.name.split(/[\/（(]/)[0].trim().toLowerCase();
            const tokens = key.split(/[\s\/]+/).filter((x) => x.length > 2);
            if (tokens.some((tok) => bag.includes(tok.toLowerCase()))) return true;
            if (mon.silhouette && name.includes(String(mon.silhouette).toLowerCase())) return true;
            if (mon.neckline && name.includes(String(mon.neckline).toLowerCase().split(/[\s-]/)[0])) return true;
            if (/mermaid|鱼尾/.test(bag) && /鱼尾|开叉|mermaid/.test(name)) return true;
            if (/cape|披肩/.test(bag) && /cape|披肩/.test(name)) return true;
            if (/halter|挂脖/.test(bag) && /halter|挂脖/.test(name)) return true;
            return false;
          });
          const fabric = TREND_ITEMS.find((t) => {
            if (t.type !== "面料") return false;
            const fab = String(mon.fabric || "").toLowerCase();
            const name = t.name.toLowerCase();
            return (
              fab &&
              (name.includes(fab) ||
                fab.includes(name.split(/\s+/)[0].toLowerCase()) ||
                (fab.includes("satin") && name.includes("satin")) ||
                (fab.includes("crepe") && name.includes("crepe")) ||
                (fab.includes("chiffon") && name.includes("chiffon")) ||
                (fab.includes("sequin") && name.includes("sequin")))
            );
          }) || null;
          const color = TREND_COLORS.find((c) => attrNorm(c.name) === attrNorm(mon.color)) || null;
          return { elements, fabric, color };
        }

        /** 社媒舆情：监控社交媒体对该类产品的评价量与产品相关好/差评主题 */
        function buildSocialProductReviews(opp, mon, commentItem) {
          const total = (mon && mon.reviews) || 0;
          const like = [];
          const dislike = [];

          if (commentItem && commentItem.comments) {
            (commentItem.comments.positive || []).slice(0, 3).forEach((c) => {
              if (c.theme) like.push(c.theme);
            });
            (commentItem.comments.negative || []).slice(0, 3).forEach((c) => {
              if (c.theme) dislike.push(c.theme);
            });
          }
          if (opp.keep && opp.keep.length) opp.keep.slice(0, 3).forEach((x) => like.push(x));
          if (opp.fix && opp.fix.length) opp.fix.slice(0, 3).forEach((x) => dislike.push(x));

          const vocRaw = opp.voc || (mon && mon.voc) || "";
          if (vocRaw) {
            String(vocRaw)
              .split(/[、,，;/]/)
              .map((s) => s.replace(/^VOC[：:]\s*/i, "").trim())
              .filter(Boolean)
              .forEach((s) => dislike.push(s));
          }

          if (mon) {
            if (mon.silhouette && !like.some((x) => /款式|廓形|silhouette/i.test(x))) {
              like.push(`款式：${mon.silhouette} 廓形认可度高`);
            }
            if (mon.fabric && !like.some((x) => /布料|面料|fabric|缎|雪纺|crepe/i.test(x))) {
              like.push(`布料：${mon.fabric} 垂感/质感被提及`);
            }
            if (mon.color && !like.some((x) => /花色|颜色|色/i.test(x))) {
              like.push(`花色：${mon.color} 上身评价偏正`);
            }
            if (mon.neckline && !like.some((x) => /领|neck/i.test(x))) {
              like.push(`款式细节：${mon.neckline} 领型好看`);
            }
          }

          if (!dislike.length && total > 0) {
            dislike.push("尺码：部分反馈偏小/需对照尺码表");
            if (mon && /satin|chiffon|mesh/i.test(String(mon.fabric || ""))) {
              dislike.push("布料：浅色/薄料场合偏透需内衬");
            }
            if (mon && mon.color) {
              dislike.push("花色：少量反馈图货色差");
            }
          }

          const uniq = (arr) => [...new Set(arr.filter(Boolean))].slice(0, 3);
          const likes = uniq(like);
          const dislikes = uniq(dislike);

          let negRate = 0.16;
          if (dislikes.length >= 2) negRate = 0.24;
          if (vocRaw) negRate = 0.3;
          if (opp.scenario === "fix_negative") negRate = 0.32;
          if (!total) {
            return {
              total: 0,
              positive: 0,
              negative: 0,
              likes,
              dislikes,
              hasData: Boolean(likes.length || dislikes.length || vocRaw),
            };
          }
          const negative = Math.max(1, Math.round(total * negRate));
          const positive = Math.max(0, total - negative);
          return { total, positive, negative, likes, dislikes, hasData: true };
        }

        function buildAiScorecard(opp) {
          const p = state.aiParams;
          const mon = monitorForOpp(opp);
          const linkedInternal = opp.internalId ? INTERNAL_HOTS.find((x) => x.id === opp.internalId) : null;
          const sampleAttrs = mon
            ? {
                silhouette: mon.silhouette,
                fabric: mon.fabric,
                neckline: mon.neckline,
                color: mon.color,
                length: mon.length,
              }
            : null;
          const similarHits = findSimilarInternals(sampleAttrs);
          const bestSimilar = similarHits.find((x) => x.isSimilar) || null;
          const nearSimilar = similarHits[0] || null;
          const trendSignals = matchTrendSignals(mon);
          const plays = mon ? mon.adPlays || 0 : 0;
          const clicks = mon ? mon.adClicks || 0 : 0;
          const adDays = mon ? mon.adDays || 0 : 0;
          const hasAdData = plays > 0;
          const listRank = opp.listRank != null ? opp.listRank : mon && mon.rank != null ? mon.rank : null;
          const price = parseMoney(opp.price) ?? (mon ? mon.price : null);
          const bandPrices = MONITOR_ROWS.filter((r) => r.line === "AT" && r.price).map((r) => r.price);
          const bandLow = bandPrices.length ? Math.min(...bandPrices) : 139;
          const bandHigh = bandPrices.length ? Math.max(...bandPrices) : 198;
          const bandMid = Math.round((bandLow + bandHigh) / 2);
          const vocText = opp.voc || (mon && mon.voc) || (opp.similar && opp.similar.note && /VOC|透|肩带|槽点/.test(opp.similar.note) ? opp.similar.note : null);
          const keepBits = (opp.keep && opp.keep.length ? opp.keep : linkedInternal && linkedInternal.keep) || (bestSimilar && bestSimilar.item.keep) || [];
          const fixBits = (opp.fix && opp.fix.length ? opp.fix : linkedInternal && linkedInternal.fix) || (bestSimilar && bestSimilar.item.fix) || [];
          const socialReviews = buildSocialProductReviews(
            opp,
            mon,
            linkedInternal || (bestSimilar && bestSimilar.item) || null
          );
          const watchDislikes =
            (socialReviews.dislikes && socialReviews.dislikes.length
              ? socialReviews.dislikes
              : fixBits.length
                ? fixBits
                : vocText
                  ? String(vocText).split(/[、,，]/)
                  : ["尺码不符", "布料透色", "花色色差"]
            )
              .map((s) => String(s).trim())
              .filter(Boolean)
              .slice(0, 3);

          let trend = 3;
          if (mon && (mon.status === "上新" || mon.status === "上升")) trend = 4;
          if (trendSignals.elements.length || trendSignals.fabric || trendSignals.color) trend = Math.max(trend, 4);
          if (mon && mon.socialHot) trend = 5;
          if (opp.scenario === "fix_negative") trend = Math.min(trend, 3);
          if (!mon) trend = 2;

          let competitor = 3;
          if (listRank != null) {
            if (listRank <= 10) competitor = 5;
            else if (listRank <= 20) competitor = 4;
            else if (listRank <= 35) competitor = 3;
            else competitor = 2;
          } else {
            competitor = 1;
          }
          if (opp.rankSemantics === "recency_proxy") competitor = Math.min(competitor, 4);

          let ad = 1;
          if (plays > 150000) ad = 5;
          else if (plays > 80000) ad = 4;
          else if (plays > 30000) ad = 3;
          else if (plays > 0) ad = 2;

          let internalScore = 3;
          if (bestSimilar || linkedInternal || (opp.similar && opp.similar.goodsId)) {
            const sales = (bestSimilar && bestSimilar.item.sales) || (linkedInternal && linkedInternal.sales) || 0;
            if (sales > 3500) internalScore = 5;
            else if (sales > 2500) internalScore = 4;
            else if (sales > 1500 || opp.similar) internalScore = opp.scenario === "fix_negative" ? 3 : 4;
            else internalScore = 3;
          } else if (opp.scenario === "pure_new") {
            internalScore = 4;
          } else if (!mon) {
            internalScore = 2;
          }

          let social = 3;
          if (!socialReviews.hasData || socialReviews.total === 0) {
            social = 2;
          } else {
            const negRatio = socialReviews.negative / Math.max(socialReviews.total, 1);
            if (negRatio >= 0.28) social = 2;
            else if (negRatio >= 0.2) social = 3;
            else if (socialReviews.total >= 100) social = 5;
            else if (socialReviews.total >= 40) social = 4;
            else social = 3;
            if (vocText || (socialReviews.dislikes && socialReviews.dislikes.some((d) => /透|肩带|尺码|色差/.test(d)))) {
              social = Math.min(social, 3);
            }
          }

          const elemNames = trendSignals.elements.map((t) => t.name).slice(0, 2);
          const primaryElem = trendSignals.elements[0];
          const trendConclusion = !mon
            ? "缺少关联样衣属性，无法对照监控报告·流行趋势中的元素/面料/颜色热度；结论标为 unknown。"
            : [
                `该样衣的「${[mon.neckline, mon.silhouette].filter(Boolean).join(" / ") || mon.title}」`,
                elemNames.length
                  ? `符合当前流行的「${elemNames.join("、")}」${primaryElem ? `（流行热度 ${primaryElem.heat}${primaryElem.change ? `，${primaryElem.change}` : ""}）` : ""}`
                  : "在流行趋势频道暂无明显元素命中，需人工复核廓形/领型是否跟流行",
                trendSignals.fabric
                  ? `；面料 ${mon.fabric} 对齐趋势「${trendSignals.fabric.name}」（热度 ${trendSignals.fabric.heat}）`
                  : mon.fabric
                    ? `；面料 ${mon.fabric} 暂无直接热度条，建议回看流行趋势·面料`
                    : "",
                trendSignals.color
                  ? `；颜色 ${mon.color} 流行热度 ${trendSignals.color.heat}（${trendSignals.color.change}）`
                  : mon.color
                    ? `；颜色 ${mon.color} 未进本周色板 Top`
                    : "",
                "。",
              ].join("");

          const rankSemanticsNote =
            opp.rankSemantics === "sales_proxy"
              ? "销量向列表"
              : opp.rankSemantics === "recency_proxy"
                ? "新到列表（勿当热销）"
                : "列表序";
          const competitorConclusion = listRank == null
            ? "无流行榜排名数据，无法判断竞品网站热度。"
            : `${mon ? mon.site + "「" + mon.title + "」" : opp.site} 流行榜排名 #${listRank}${
                mon && mon.prevRank != null ? `（上轮 #${mon.prevRank} → 本轮 #${mon.rank}）` : ""
              }${mon && mon.status ? `，状态 ${mon.status}` : ""}；口径为${rankSemanticsNote}。`;

          const adConclusion = !hasAdData
            ? "无广告投放数据（播放 / 点击 / 投放天数为空或为 0），付费验证强度 unknown。"
            : `广告播放 ${formatAdMetric(plays)} · 点击 ${formatAdMetric(clicks)} · 投放 ${adDays} 天${
                mon && mon.platform ? `（${mon.platform}）` : ""
              }${mon && mon.adCopy ? `；素材叙事：「${mon.adCopy}」` : ""}。`;

          let internalConclusion;
          if (bestSimilar) {
            internalConclusion = `按群形/布料/领形/颜色/裙长比对，与站内「${bestSimilar.item.name}」（${bestSimilar.item.goodsId}）属性重合 ${bestSimilar.pct}%（≥80% 判相似）；近 12 月销量约 ${bestSimilar.item.sales.toLocaleString()}，退货率 ${bestSimilar.item.returnRate}%。`;
          } else if (opp.similar && opp.similar.goodsId) {
            internalConclusion = `机会已关联内部款 ${opp.similar.goodsId}${opp.similar.note ? `（${opp.similar.note}）` : ""}；属性自动比对${nearSimilar ? `最近似站内款重合 ${nearSimilar.pct}%` : "未跑出 ≥80% 命中"}。`;
          } else if (nearSimilar && nearSimilar.pct >= 50) {
            internalConclusion = `无内部相似款（最高重合 ${nearSimilar.pct}% < 80% 门槛，对照「${nearSimilar.item.name}」）；纯新空间成立，但需防后续撞款。`;
          } else {
            internalConclusion = "无内部相似款（群形/布料/领形等多维属性未达 80% 重合）；可作纯新开款候选。";
          }

          const socialConclusion = !socialReviews.hasData
            ? "暂无该类产品的社交媒体评价样本；建议到舆情平台按品类/属性检索评价量与好差评主题后回填。"
            : socialReviews.total === 0
              ? `有主题线索但缺评价量：好评偏好「${(socialReviews.likes || []).join("、") || "—"}」；差评吐槽「${(socialReviews.dislikes || []).join("、") || "—"}」。`
              : [
                  `监控社交媒体对该类产品共 ${socialReviews.total} 条评价，好评 ${socialReviews.positive}、差评 ${socialReviews.negative}`,
                  socialReviews.likes.length
                    ? `；好评喜欢：${socialReviews.likes.join("；")}`
                    : "",
                  socialReviews.dislikes.length
                    ? `；差评吐槽：${socialReviews.dislikes.join("；")}`
                    : "",
                  "（聚焦尺码、款式、布料、花色等产品相关内容）。",
                ].join("");

          const factors = [
            {
              key: "trend",
              label: "流行趋势",
              conclusion: trendConclusion,
              sourceLabel: "监控报告 · 流行趋势",
              sourceJump: "trends",
              score: clampFactorScore(trend),
              weight: Number(p.trendWeight) || 0,
            },
            {
              key: "competitor",
              label: "竞品网站热度",
              conclusion: competitorConclusion,
              sourceLabel: "监控报告 · 竞品网站",
              sourceJump: "sites",
              score: clampFactorScore(competitor),
              weight: Number(p.competitorWeight) || 0,
            },
            {
              key: "ad",
              label: "广告投放",
              conclusion: adConclusion,
              sourceLabel: "监控报告 · 广告投流",
              sourceJump: "ads",
              score: clampFactorScore(ad),
              weight: Number(p.adWeight) || 0,
            },
            {
              key: "internal",
              label: "内部相似款销售",
              conclusion: internalConclusion,
              sourceLabel: "监控报告 · 站内爆款",
              sourceJump: "internal",
              score: clampFactorScore(internalScore),
              weight: Number(p.internalWeight) || 0,
            },
            {
              key: "social",
              label: "社媒舆情",
              conclusion: socialConclusion,
              sourceLabel: "舆情平台 · VOC",
              sourceHref: "https://az-voc-t.azazie.com/",
              score: clampFactorScore(social),
              weight: Number(p.socialWeight) || 0,
            },
          ];

          const weightSum = factors.reduce((s, f) => s + f.weight, 0) || 100;
          const total = factors.reduce((s, f) => s + (f.score / 5) * (f.weight / weightSum) * 100, 0);
          const totalRound = Math.round(total);
          const go = Number(p.goScore) || 75;
          const caution = Number(p.cautionScore) || 50;
          let decision = "不建议推";
          let decisionClass = "ai-decision__value--nogo";
          let decisionNote = "综合分低于谨慎阈值";
          if (totalRound >= go) {
            decision = "建议推";
            decisionClass = "ai-decision__value--go";
            decisionNote = "综合分达到建议推阈值，且无关键负向槽点阻断";
          } else if (totalRound >= caution) {
            decision = "谨慎·MTO";
            decisionClass = "ai-decision__value--caution";
            decisionNote = "需求存在但证据不足或存在改款风险，建议小批验证";
          }
          if (vocText && opp.scenario === "fix_negative") {
            decision = "谨慎·MTO";
            decisionClass = "ai-decision__value--caution";
            decisionNote = "存在可定位 VOC 槽点，建议负向改款小批验证后再扩量";
          }

          const gaps = [];
          if (!mon) gaps.push("无关联竞品监控行：流行趋势 / 竞品排名 / 广告多为推断。");
          if (listRank == null) gaps.push("无流行榜排名数据。");
          if (!hasAdData) gaps.push("无广告投放数据。");
          if (!bestSimilar && !(opp.similar && opp.similar.goodsId)) gaps.push("无内部相似款（属性重合未达 80%）。");
          if (!socialReviews.hasData || socialReviews.total === 0) gaps.push("无社媒产品评价量（缺评价条数/好差评拆分）。");
          if (socialReviews.hasData && socialReviews.total > 0 && !socialReviews.dislikes.length) {
            gaps.push("有评价量但差评主题未结构化（尺码/款式/布料/花色待标注）。");
          }
          if (opp.rankSemantics === "recency_proxy") gaps.push("列表口径为新到代理，缺销量向热度交叉验证。");
          if (mon && !mon.shipsNow && opp.scenario === "pure_new") gaps.push("竞品非 Ships Now，现货可得性未验证。");
          if (!gaps.length) gaps.push("关键五维证据齐全；仍建议人工抽查流行热度条与广告口径。");

          const silhouette = mon ? mon.silhouette : "";
          const neckline = mon ? mon.neckline : "";
          const fabric = mon ? mon.fabric : "";
          const color = mon ? mon.color : "";
          const priceAdvice =
            price != null
              ? `竞品价 $${price}，AT 监测价带约 $${bandLow}–$${bandHigh}（中位约 $${bandMid}）；建议计划售价落在 $${Math.max(bandLow, Math.round(price * 0.92))}–$${Math.min(bandHigh, Math.round(price * 1.05))}。`
              : `缺少竞品明确售价；建议先回填竞品价，再按 AT 价带 $${bandLow}–$${bandHigh} 给出计划售价建议。`;

          const keepAdvice = keepBits.length
            ? `一定要保留：${keepBits.slice(0, 3).join("、")}${silhouette ? `；主廓形 ${silhouette}` : ""}${fabric ? ` / 主料 ${fabric}` : ""}。`
            : `一定要保留：${[neckline, silhouette, fabric, color].filter(Boolean).slice(0, 3).join("、") || "竞品已验证的主廓形与主面料"}（写入改款说明「保留项」）。`;

          const changeAdvice = (() => {
            if (opp.scenario === "fix_negative" || vocText || (socialReviews.dislikes && socialReviews.dislikes.length)) {
              const slot = vocText || (socialReviews.dislikes || []).slice(0, 2).join("、") || fixBits.slice(0, 2).join("、") || "待补差评主题";
              return `建议修改：针对差评吐槽「${slot}」做产品侧修正（尺码表/内衬/结构等），单次只改主缺陷；改款说明与版单备注写清验收点。`;
            }
            if (opp.scenario === "fix_positive") {
              return `建议修改：在自有爆款上叠加竞品高热元素「${neckline || (primaryElem && primaryElem.name) || "高曝光领型"}」，单主维度改款；改款说明区分保留项 / 叠加项，避免多维同改。`;
            }
            if (primaryElem) {
              return `建议修改：可微调细节强化「${primaryElem.name}」辨识度，但勿改掉已验证的 ${silhouette || "主廓形"}；版单备注标注面料与裙长。`;
            }
            return `建议修改：优先对齐竞品爆款细节（领型/开叉/袖型择一），改款说明写清「保留 vs 变更」；版单备注补齐样衣色与主料。`;
          })();

          const followUpAdvice = `上新后跟踪：30 日销量与退货率；差评重点盯「${watchDislikes.join("、")}」等产品问题是否复现（不要把流行卖点本身当成差评预警对象）。`;

          let actions;
          if (decision === "建议推") {
            actions = [keepAdvice, changeAdvice, priceAdvice, followUpAdvice];
          } else if (decision === "谨慎·MTO") {
            actions = [
              keepAdvice,
              changeAdvice,
              priceAdvice,
              "建议先 MTO / 小批：只验证主修改项是否闭环差评槽点或元素叠加是否伤转化；回看指标定 14–30 日。",
              "补齐证据缺口后再提审；若产品槽点无法在现有工艺闭环，改判不建议推或换特征模板。",
            ];
          } else {
            actions = [
              "暂不推进开款：把本机会降为观察池，继续跟踪流行趋势热度与竞品流行榜排名变化。",
              !hasAdData
                ? "利用方式：先补广告投流证据；若后续出现高播放验证，再重新分析。"
                : "利用方式：可拆成「元素/面料灵感板」供正向改款素材，不必整款跟进。",
              bestSimilar || nearSimilar
                ? `若需消化需求：优先评估站内近款「${(bestSimilar || nearSimilar).item.name}」做负向/正向改款，而不是重复开高度同质新款。`
                : "若战略必须跟进：先补全五维证据（尤其排名与社媒产品评价），再重新跑分析。",
              priceAdvice,
            ];
          }

          const risks = [];
          if (opp.rankSemantics === "recency_proxy") {
            risks.push(`竞品排名 #${listRank ?? "—"} 来自新到列表，不能直接等同热销；若销量向列表未跟上，存在跟空风险。`);
          } else if (listRank != null && hasAdData && listRank > 20 && plays > 80000) {
            risks.push(`列表序偏后（#${listRank}）但广告播放偏高（${formatAdMetric(plays)}），列表热度与付费热度不一致，需人工复核是否买量堆出来的曝光。`);
          } else if (listRank != null && listRank <= 10 && !hasAdData) {
            risks.push(`流行榜靠前（#${listRank}）但无广告投放数据，需确认是否为自然列表热度，避免误判可持续性。`);
          }
          if (vocText) {
            risks.push(`舆情槽点「${vocText}」若未在版单工艺闭环，上新后易重复客诉并拉高退货。`);
          } else if (fixBits.length) {
            risks.push(`站内相似路径差评主题「${fixBits.slice(0, 2).join("、")}」可能迁移到本机会，需在改款说明里显式规避。`);
          }
          if (bestSimilar && bestSimilar.item.returnRate >= 11) {
            risks.push(`相似款 ${bestSimilar.item.name} 退货率 ${bestSimilar.item.returnRate}% 偏高，直接仿款可能继承退货结构问题。`);
          }
          if (mon && mon.status === "下降") {
            risks.push(`竞品状态为下降，流行窗口可能正在收窄，跟进时效风险升高。`);
          }
          if (price != null && price > bandHigh) {
            risks.push(`竞品价 $${price} 高于 AT 监测价带上限 $${bandHigh}，定价过高会伤转化；过低则利润空间不足。`);
          }
          if (!risks.length) {
            risks.push("当前来源信息未发现尖锐冲突；仍需防范合规/工艺硬阻断与上新后口碑反转。");
          }

          return {
            factors,
            total: totalRound,
            weightSum,
            go,
            caution,
            decision,
            decisionClass,
            decisionNote,
            gaps,
            actions,
            risks,
          };
        }

        function sitesInLine(line) {
          const g = SITE_GROUPS.find((x) => x.line === line);
          if (!g) return [];
          return g.sites.filter((s) => s.enabled !== false).map((s) => s.name);
        }

        function filteredSitesRows(mode) {
          const f = state.filters;
          const line = state.siteLine || "AT";
          const allowed = sitesInLine(line);
          const forReport = mode === "report";
          const picked = forReport || state.selectedSites == null ? allowed : state.selectedSites;
          return MONITOR_ROWS.filter((r) => {
            if (r.line !== line) return false;
            if (!picked.includes(r.site)) return false;
            if (!forReport) {
              if (f.category !== "全部" && r.category !== f.category) return false;
              if (f.status !== "全部" && r.status !== f.status) return false;
              if (f.shipsNow === "是" && !r.shipsNow) return false;
              if (f.shipsNow === "否" && r.shipsNow) return false;
              if (!matchesDesignFilters(r, f)) return false;
            }
            return true;
          });
        }

        function rankDeltaLabel(r) {
          if (r.status === "上新") return "新上榜";
          if (r.status === "下架") return "已下架";
          if (r.prevRank == null || r.rank == null) return "—";
          const d = r.prevRank - r.rank;
          if (d > 0) return "↑ +" + d;
          if (d < 0) return "↓ " + d;
          return "持平";
        }

        function productUrlOf(r) {
          return r.productUrl || ((SITE_GROUPS.flatMap((g) => g.sites).find((s) => s.name === r.site) || {}).url || "#");
        }

        function renderSiteProductCard(r) {
          const checked = rowChecked(r.id);
          const hue = r.imgHue || "220";
          const disc = r.discount > 0 ? `<span class="prod-card__discount" title="竞品站现价相对原价折扣">${r.discount}% OFF</span>` : "";
          const listP =

          return `

                <p class="prod-card__tags">${escapeHtml(r.detailTags || r.fabric || "")}</p>
                <div class="prod-card__price-row">
                  <strong>$${r.price}</strong>${listP}
                  <span class="prod-card__rank">#${r.rank ?? "—"} · ${rankDeltaLabel(r)}</span>
                </div>
                <div class="prod-card__meta">
                  <span>评论 ${r.reviews != null ? r.reviews : "—"}</span>
                  <span>${r.shipsNow ? "Ships Now" : "非现货"}</span>
                  <span>${escapeHtml(r.category)}</span>
                </div>
                <div class="prod-card__actions">
                  <a class="btn btn--ghost" href="${escapeAttr(productUrlOf(r))}" target="_blank" rel="noopener">商品详情</a>
                </div>
              </div>
            </article>`;
        }

        function buildSitesAiSummary(rows, f) {
          const scopeCat = state.siteLine || "AT";
          const scopeSite =
            state.selectedSites == null
              ? "品类线全部站点"
              : state.selectedSites.length
                ? state.selectedSites.join("、")
                : "未选站点";
          const newCnt = rows.filter((r) => r.status === "上新").length;
          const upCnt = rows.filter((r) => r.status === "上升").length;
          const downCnt = rows.filter((r) => r.status === "下降").length;
          const offCnt = rows.filter((r) => r.status === "下架").length;
          const prices = rows.map((r) => r.price).sort((a, b) => a - b);
          const mid = prices.length ? prices[Math.floor(prices.length / 2)] : null;
          const colors = {};
          const fabrics = {};
          const necks = {};
          const lengths = {};
          rows.forEach((r) => {
            colors[r.color] = (colors[r.color] || 0) + 1;
            if (r.fabric) fabrics[r.fabric] = (fabrics[r.fabric] || 0) + 1;
            if (r.neckline) necks[r.neckline] = (necks[r.neckline] || 0) + 1;
            if (r.length) lengths[r.length] = (lengths[r.length] || 0) + 1;
          });
          const topN = (obj, n) =>
            Object.entries(obj)
              .sort((a, b) => b[1] - a[1])
              .slice(0, n)
              .map(([k, v]) => `${k}(${v})`)
              .join("、") || "样本不足";
          const hot = rows
            .filter((r) => r.status === "上升" || r.status === "上新")
            .slice()
            .sort((a, b) => (a.rank || 999) - (b.rank || 999))
            .slice(0, 3);
          const hotLine = hot.length
            ? hot.map((r) => `${r.site}「${r.title} / ${r.color}」#${r.rank ?? "—"}`).join("；")
            : "当前筛选暂无上新/上升样本";
          const discAvg = rows.filter((r) => r.discount > 0);
          const discHint = discAvg.length
            ? `有折扣款 ${discAvg.length}，平均折扣约 ${Math.round(discAvg.reduce((s, r) => s + r.discount, 0) / discAvg.length)}%`
            : "本批样本折扣信号偏弱";
          const gapHints = [];
          if (Object.keys(lengths).some((k) => /Mini/i.test(k))) gapHints.push("mini / 短裙流量位");
          if (Object.keys(fabrics).some((k) => /Crepe|Jersey|Satin|Sequin/i.test(k))) gapHints.push("crepe / jersey / satin / sequin 面料线");
          if (Object.keys(necks).some((k) => /Halter|Plunge|Cowl|V-neck/i.test(k))) gapHints.push("halter / plunge / cowl / v-neck 领口变化");
          if (!gapHints.length) gapHints.push("需更多样本后再判定覆盖缺口");
          return {
            week: f.week,
            scopeCat,
            scopeSite,
            newCnt,
            upCnt,
            downCnt,
            offCnt,
            mid,
            topColors: topN(colors, 4),
            topFabrics: topN(fabrics, 3),
            topNecks: topN(necks, 3),
            topLengths: topN(lengths, 3),
            hotLine,
            discHint,
            gapHints: gapHints.join("；"),
            total: rows.length,
          };
        }

        function filteredInternal() {
          const f = state.filters;
          return INTERNAL_HOTS.filter((r) => {
            if (f.category !== "全部" && r.category !== f.category) return false;
            if (state.internalOppFilter === "fix_negative" && r.opportunity !== "fix_negative") return false;
            if (state.internalOppFilter === "fix_positive" && r.opportunity !== "fix_positive") return false;
            if (!matchesDesignFilters(r, f)) return false;
            return true;
          }).slice().sort((a, b) => b.sales - a.sales);
        }

        function fmtMoney(n) {
          return "$" + Math.round(n).toLocaleString("en-US");
        }

        function fmtPct(n, digits) {
          const d = digits == null ? 1 : digits;
          const sign = n > 0 ? "+" : "";
          return (n > 0 ? sign : "") + Number(n).toFixed(d) + "%";
        }

          const cls = n >= 0 ? "trend-pill trend-pill--up" : "trend-pill trend-pill--down";

        function sparkline(values, opts) {
          const w = (opts && opts.w) || 520;
          const h = (opts && opts.h) || 160;
          const pad = 8;
          const min = Math.min(...values);
          const max = Math.max(...values);
          const span = max - min || 1;
          const pts = values
            .map((v, i) => {
              const x = pad + (i * (w - pad * 2)) / Math.max(values.length - 1, 1);
              const y = h - pad - ((v - min) / span) * (h - pad * 2);
              return x.toFixed(1) + "," + y.toFixed(1);
            })
            .join(" ");
          return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2.5" points="${pts}"/></svg>`;
        }

        function donutSlicePath(cx, cy, r0, r1, a0, a1) {
          const polar = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
          const [x0, y0] = polar(r1, a0);
          const [x1, y1] = polar(r1, a1);
          const [x2, y2] = polar(r0, a1);
          const [x3, y3] = polar(r0, a0);
          const large = a1 - a0 > Math.PI ? 1 : 0;
          return `M ${x0} ${y0} A ${r1} ${r1} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${r0} ${r0} 0 ${large} 0 ${x3} ${y3} Z`;
        }

        function renderDonutBlock(items, centerLabel) {
          const total = items.reduce((s, t) => s + t.heat, 0) || 1;
          const cx = 120;
          const cy = 120;
          const rOut = 102;
          const rIn = 64;
          let a0 = -Math.PI / 2;
          const slices = items.map((t, i) => {
            const span = (t.heat / total) * Math.PI * 2;
            const a1 = a0 + Math.max(span, 0.02);
            const path = donutSlicePath(cx, cy, rIn, rOut, a0, a1);
            const share = (t.heat / total) * 100;
            const color = TREND_PALETTE[i % TREND_PALETTE.length];
            const mid = (a0 + a1) / 2;
            a0 = a1;
            return { t, path, share, color, mid };
          });
          return `
            <div class="donut-block">
              <ul class="donut-legend">
                ${slices
                  .map(
                    (s) => `
                  <li>
                    <button type="button" class="donut-legend__btn" data-trend-item="${s.t.id}" title="${escapeAttr(s.t.name)}">
                      <i style="background:${s.color}"></i>
                      <span class="donut-legend__name">${escapeHtml(s.t.name)}</span>
                      <strong>${s.share.toFixed(1)}%</strong>
                    </button>
                  </li>`
                  )
                  .join("")}
              </ul>
              <div class="donut-chart-wrap">
                <svg class="donut-svg" viewBox="0 0 240 240" role="img" aria-label="${escapeAttr(centerLabel)}">
                  ${slices
                    .map(
                      (s) => `
                    <path class="donut-seg" d="${s.path}" fill="${s.color}" data-trend-item="${s.t.id}" data-tip="${escapeAttr(s.t.name + " · " + s.share.toFixed(1) + "% · 热度 " + s.t.heat)}">
                      <title>${escapeHtml(s.t.name)} ${s.share.toFixed(1)}%</title>
                    </path>`
                    )
                    .join("")}
                </svg>
                <div class="donut-center"><span>${escapeHtml(centerLabel)}</span></div>
                <div class="donut-tip" hidden></div>
              </div>
            </div>`;
        }

        function sortedPoolList(list) {
          const arr = list.slice();
          if (state.scenarioFilter !== "pure_new" && state.scenarioFilter !== "all") return arr;
          const emailSites = new Set(EMAIL_ROWS.map((e) => e.brand));
          let out = arr;
          if (state.poolEmailOnly) {
            out = out.filter((o) => emailSites.has(o.site) || (o.emailHero));
          }
          const key = state.poolSort || "hot";
          out.sort((a, b) => {
            if (key === "new") {
              const ta = a.detectedAt || a.listRank || 999;
              const tb = b.detectedAt || b.listRank || 999;
              // prefer status 上新 first then lower listRank as proxy of newer
              const sa = a.monitorId && (MONITOR_ROWS.find((r) => r.id === a.monitorId) || {}).status === "上新" ? 0 : 1;
              const sb = b.monitorId && (MONITOR_ROWS.find((r) => r.id === b.monitorId) || {}).status === "上新" ? 0 : 1;
              if (sa !== sb) return sa - sb;
              return (a.listRank || 999) - (b.listRank || 999);
            }
            if (key === "ads") {
              const score = (o) => (Number(o.adPlays) || 0) * Math.max(1, Number(o.adDays) || 1);
              return score(b) - score(a);
            }
            // hot
            return (a.listRank || 999) - (b.listRank || 999);
          });
          return out;
        }

                  <div class="scheme-kv__row"><dt>改款要点</dt><dd>${escapeHtml(s.evidence)}</dd></div>

                       <button type="button" class="btn btn--primary" id="btn-submit-lead">提交至品类负责人</button>`
                }
              </div>
            </div>
            ${renderSchemeReviewModal()}
            ${renderSyncReceipts()}`;

        function renderSyncReceipts() {
          const approvalLabel = {
            approved: ["已通过", "tag--success"],
            rejected: ["已驳回", "tag--danger"],
            in_review: ["审批中", "tag--waiting"],
            submitted: ["已提交", "tag--waiting"],
          };
          const syncLabel = {
            Synced_To_Selection: ["已写入选款", "tag--success"],
            Sync_Pending: ["同步中", "tag--waiting"],
            Sync_Failed: ["同步失败", "tag--danger"],
            "N/A": ["未写入", ""],
          };
          const stepCls = {
            done: "is-done",
            active: "is-active",
            rejected: "is-rejected",
            failed: "is-failed",
            pending: "is-pending",
            future: "is-future",
            blocked: "is-blocked",
            skipped: "is-skipped",
          };
          const canSeeFeedback = state.role === "ops" || state.role === "lead" || state.role === "admin";
          const rows = SYNC_RECEIPTS.map((r) => {
            const open = state.receiptDetailId === r.schemeId;
            const [aLab, aCls] = approvalLabel[r.approvalStatus] || [r.approvalStatus, ""];
            const [sLab, sCls] = syncLabel[r.syncStatus] || [r.syncStatus, ""];
            const linked = !!(r.goodsId && r.goodsId !== "—");
            const goodsCell = linked
              ? `<span class="mono receipt-goods is-linked">${escapeHtml(r.goodsId)}</span>`
              : `<span class="receipt-goods is-missing">未关联</span>`;
            const steps = r.progress || [];
            const detail = open
              ? `<div class="receipt-detail">
                  <div class="receipt-detail__block receipt-detail__block--progress">
                    <h4>审批进度 · 落地链路追踪</h4>
                    <p class="receipt-detail__hint">成稿→审批→写入选款；其后生管/打版、上架动销待下游打通后按 goods_id 回写</p>
                    <ol class="receipt-progress receipt-progress--h">
                      ${steps
                        .map(
                          (p) => `
                        <li class="receipt-progress__step ${stepCls[p.state] || ""} ${["plm", "launch"].includes(p.key) ? "is-landing" : ""}">
                          <span class="receipt-progress__dot"></span>
                          <div class="receipt-progress__body">
                            <strong>${escapeHtml(p.label)}</strong>
                            ${p.detail ? `<span class="receipt-progress__detail">${escapeHtml(p.detail)}</span>` : ""}
                            <span class="receipt-progress__meta">${p.at ? escapeHtml(p.at) : "—"}</span>
                          </div>
                        </li>`
                        )
                        .join("")}
                    </ol>
                  </div>
                  ${
                    canSeeFeedback
                      ? `<div class="receipt-detail__block receipt-detail__block--feedback">
                    <h4>驳回建议 / 负责人批注${state.role === "ops" ? " · 运营可阅" : ""}</h4>
                    ${
                      r.rejectReason
                        ? `<div class="receipt-feedback receipt-feedback--reject"><strong>驳回建议</strong><p>${escapeHtml(r.rejectReason)}</p></div>`
                        : `<div class="receipt-feedback muted">无驳回记录</div>`
                    }
                    ${
                      r.annotations
                        ? `<div class="receipt-feedback receipt-feedback--note"><strong>批注</strong><p>${escapeHtml(r.annotations)}</p></div>`
                        : `<div class="receipt-feedback muted">暂无批注</div>`
                    }
                  </div>`
                      : ""
                  }
                </div>`
              : "";
            return `
              <tr class="receipt-row ${open ? "is-open" : ""}">
                <td>
                  <div class="receipt-scheme">
                    <span class="mono">${escapeHtml(r.schemeId)}</span>
                    <span class="muted">${escapeHtml(r.title)}</span>
                  </div>
                </td>
                <td>${SCENARIO_META[r.scenario] ? SCENARIO_META[r.scenario].label : r.scenario}</td>
                <td><span class="tag ${aCls}">${aLab}</span></td>
                <td>${goodsCell}</td>
                <td><span class="tag ${sCls}">${sLab}</span>${r.retries ? `<span class="muted"> · 重试 ${r.retries}</span>` : ""}</td>
                <td>${escapeHtml(r.updated)}</td>
                <td class="col-actions">
                  <div class="receipt-row__actions">
                    <button type="button" class="btn btn--ghost btn--sm" data-receipt-toggle="${escapeAttr(r.schemeId)}">${open ? "收起" : "查看进度"}</button>
                    ${r.syncStatus === "Sync_Failed" ? `<button type="button" class="btn btn--ghost btn--sm" data-retry-sync="${escapeAttr(r.schemeId)}">重试同步</button>` : ""}
                  </div>
                </td>
              </tr>
              ${open ? `<tr class="receipt-detail-row"><td colspan="7">${detail}</td></tr>` : ""}`;
          }).join("");
          return `
            <div class="data-panel receipt-panel" style="margin-top:22px">
              <div class="data-panel__header">
                <div>
                  <h3>历史方案 / 写入选款回执</h3>
                  <p>查看审批进度与落地链路、驳回建议与批注（运营可阅）；列表可看是否关联 goods_id</p>
                </div>
              </div>
              <div class="table-wrap"><table class="data-table receipt-table">
                <colgroup>
                  <col class="col-scheme" />
                  <col class="col-scenario" />
                  <col class="col-approval" />
                  <col class="col-goods" />
                  <col class="col-sync" />
                  <col class="col-updated" />
                  <col class="col-actions" />
                </colgroup>
                <thead><tr><th>方案</th><th>场景</th><th>审批</th><th>goods_id</th><th>写入选款</th><th>更新</th><th class="col-actions">操作</th></tr></thead>
                <tbody>${rows}</tbody>
              </table></div>
            </div>`;
        }

        function drawRefs() {
          const s = ensureScheme();
          const box = app.querySelector("#refRows");
          const addBtn = app.querySelector("#addRef");
          if (!box) return;
          box.innerHTML = s.refs
            .map(
              (r, i) => `
            <div class="ref-row">
              <input data-ref-no="${i}" placeholder="参考款号 ${i + 1}" value="${r.no || ""}">
              <input data-ref-url="${i}" placeholder="参考款链接 ${i + 1}（https://）" value="${r.url || ""}">
              <button type="button" data-ref-del="${i}" ${s.refs.length <= 1 ? "disabled" : ""}>删除</button>
            </div>`
            )
            .join("");
          if (addBtn) addBtn.disabled = s.refs.length >= 3;
          box.querySelectorAll("[data-ref-no]").forEach((el) =>
            el.addEventListener("input", () => {
              s.refs[Number(el.getAttribute("data-ref-no"))].no = el.value;
            })
          );
          box.querySelectorAll("[data-ref-url]").forEach((el) =>
            el.addEventListener("input", () => {
              s.refs[Number(el.getAttribute("data-ref-url"))].url = el.value;
            })
          );
          box.querySelectorAll("[data-ref-del]").forEach((el) =>
            el.addEventListener("click", () => {
              const i = Number(el.getAttribute("data-ref-del"));
              if (s.refs.length <= 1) return;
              s.refs.splice(i, 1);
              drawRefs();
            })
          );
          if (addBtn) {
            addBtn.onclick = () => {
              if (s.refs.length >= 3) return;
              s.refs.push({ no: "", url: "" });
              drawRefs();
            };
          }
        }

        function bindSchemeFields() {
          const s = ensureScheme();
          const byProductId = {};
          Object.keys(GOODS_MASTER).forEach((k) => {
            const g = GOODS_MASTER[k];
            byProductId[g.productId] = g;
          });
          app.querySelectorAll("[data-sf]").forEach((el) => {
            el.addEventListener("input", () => {
              const key = el.getAttribute("data-sf");
              s[key] = el.value;
              if (key === "plannedPrice" || key === "multiplier") {
                const view = app.querySelector("#maxCostView");
                if (view) view.value = maxCost(s.plannedPrice, s.multiplier);
              }
            });
            el.addEventListener("change", () => {
              const key = el.getAttribute("data-sf");
              s[key] = el.value;
              if (key === "productId" && byProductId[el.value]) {
                const d = byProductId[el.value];
                s.ddid = d.ddid;
                s.category = d.category;
                s.brand = d.brand;
                s.productName = d.productName;
                s.fabric = d.fabric;
                render();
              }
            });
          });
          drawRefs();
        }
